# Local standalone form (rule 18). Publishes 127.0.0.1 only.
# Settings come from the one shared file, ~/Development/.env (or STANDALONE_ENV).
services:
  app:
    build: .
    image: ai-gateway-client-lab:local
    ports:
      - "127.0.0.1:${HOST_PORT:-6880}:6880"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "6880"
      # Rule 26 (owner, 2026-11-17): the boot mode is sticky. MODE=live in the settings file starts the
      # lab in Live on boot, so a rebuild cannot silently drop it back to Mock. Mock stays the default.
      MODE: ${MODE:-mock}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-ai-gateway-client.local.ping-devops.com}
    env_file:
      - path: ${STANDALONE_ENV:-../.env}
        required: false
    restart: unless-stopped
